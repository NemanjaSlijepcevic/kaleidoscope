{% extends 'base.html' %}
{% load i18n %}
{% load django_bootstrap5 %}
{% load static %} 
{% block content %}
    
<div class="shadow-none p-3 mb-3 bg-body-tertiary rounded border">
    <div class="p-2">
        <form id="image-search-form" method="get" data-url="{% url 'images:image-list' %}">
            <label for="search-field" class="form-label h4">{% trans "Search" %}</label>
            <input class="form-control mt-2" type="text" name="search-field" id="search-field" placeholder="{% trans 'Search images' %}" aria-label="default input example"/>
        </form>
    </div>
    
    <div class="row g-3 p-2">
        <div class="col-md-4">
            <label for="author-filter" class="form-label">{% trans "Author" %}</label>
            <select class="form-select" id="author-filter" name="author">
                <option value="">{% trans "All" %}</option>
                {% for author in authors %}
                    <option value="{{ author.id }}" {% if author.id|stringformat:"s" == selected_author %}selected{% endif %}>
                        {{ author.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="place-filter" class="form-label">{% trans "Place" %}</label>
            <select class="form-select" id="place-filter" name="place">
                <option value="">{% trans "All" %}</option>
                {% for place in places %}
                    <option value="{{ place.id }}" {% if place.id|stringformat:"s" == selected_place %}selected{% endif %}>
                        {{ place.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="year-filter" class="form-label">{% trans "Year" %}</label>
            <select class="form-select" id="year-filter" name="year">
                <option value="">{% trans "All" %}</option>
                {% for year in years %}
                    <option value="{{ year.id }}" {% if year.id|stringformat:"s" == selected_year %}selected{% endif %}>
                        {{ year.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="row g-2 p-2">
        <div class="col-12">
            <label class="form-label">{% trans "Categories" %}</label>
            <div class="d-flex flex-wrap gap-2">
                {% for category in categories %}
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="category" id="category-{{ category.id }}" value="{{ category.id }}" {% if category.id|stringformat:"s" in selected_categories %}checked{% endif %}>
                    <label class="form-check-label" for="category-{{ category.id }}">{{ category.name }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<div id="loading-spinner" class="d-flex justify-content-center" style="display: none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...
    </div>
</div>

{% include 'partials/pagination.html' %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3" id="image-gallery"></div>

<div class="modal fade" id="imageLightbox" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 position-relative">
                <button class="carousel-control-prev" type="button" id="lightboxPrev" aria-label="Previous image">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                </button>
                <button class="carousel-control-next" type="button" id="lightboxNext" aria-label="Next image">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                </button>
                <img id="lightboxImage" class="img-fluid" alt="">
                <div id="lightboxDescription" class="position-absolute bottom-0 start-0 end-0 p-2 text-white bg-dark bg-opacity-50" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>
{% include 'partials/pagination.html' %}

{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/gallery.js' %}"></script>
<script>
    function sendHeight() {
        const height = document.documentElement.scrollHeight;
        window.parent.postMessage({ frameHeight: height }, "*");
    }

    window.addEventListener("load", sendHeight);
    window.addEventListener("resize", sendHeight);

    // Event-driven instead of a polling timer: reading scrollHeight forces a
    // layout, and doing it on an interval reflowed the page twice a second for
    // as long as it stayed open.
    if (window.ResizeObserver) {
        new ResizeObserver(sendHeight).observe(document.body);
    } else {
        setInterval(sendHeight, 500);
    }
</script>
{% endblock %}
