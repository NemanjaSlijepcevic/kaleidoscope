{% load i18n %}
{% comment %}
Rendered both above and below the gallery, so it uses classes rather than ids
and gallery.js drives every copy on the page at once.
{% endcomment %}
<div class="kg-pagerow">
    <nav aria-label="{% trans 'Page navigation' %}" class="me-1">
        <select name="paginate_by" class="form-select w-auto js-paginate-by">
            <option value="12">12</option>
            <option selected="selected" value="24">24</option>
            <option value="48">48</option>
            <option value="100">100</option>
            <option value="all">{% trans "All" %}</option>
        </select>
    </nav>
    <ul class="pagination js-pagination"></ul>
</div>
